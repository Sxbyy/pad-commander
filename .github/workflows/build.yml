name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Änderungen anwenden
        id: edits
        run: |
          if ls edits/*.edit >/dev/null 2>&1; then
            python3 scripts/apply_edits.py 2>&1 | tee "$RUNNER_TEMP/edits.log"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Änderungen angewendet [skip ci]"
            git push -q origin HEAD:main
          else
            echo "keine Änderungen" > "$RUNNER_TEMP/edits.log"
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/built_sha"

      - name: Werkzeuge und Version
        run: |
          brew install xcodegen
          VERSION=$(sed -nE 's/^ *MARKETING_VERSION: *"?([0-9.]+)"?.*/\1/p' project.yml | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          {
            xcodebuild -version
            xcodegen --version
            echo "Pad Commander $VERSION (Build $GITHUB_RUN_NUMBER)"
          } | tee "$RUNNER_TEMP/info.log"

      - name: Projekt erzeugen
        run: |
          swift scripts/make_icon.swift PadCommander/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate

      - name: Bauen (iPad, unsigniert)
        id: build
        run: |
          set +e
          xcodebuild -quiet -project PadCommander.xcodeproj -scheme PadCommander -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > "$RUNNER_TEMP/build.log" 2>&1
          rc=$?
          set -e
          grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -150 || true
          if [ $rc -ne 0 ]; then tail -60 "$RUNNER_TEMP/build.log"; exit $rc; fi
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/PadCommander.app out/Payload/
          (cd out && zip -qry PadCommander.ipa Payload)
          ls -la out

      # Dieselben Quellen als Paket fuer die App „Swift Playground“ (direkt auf dem iPad starten, ohne PC)
      - name: Swift-Playground-Paket
        id: playground
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          L="$RUNNER_TEMP/playground.log"
          python3 scripts/make_playground.py out/pg "$VERSION" "$BUILD" > "$L" 2>&1
          (cd out/pg && zip -qry ../PadCommander.swiftpm.zip PadCommander.swiftpm)
          cp -R out/pg/PadCommander.swiftpm "$RUNNER_TEMP/pgcheck"
          cd "$RUNNER_TEMP/pgcheck"
          set +e
          xcodebuild -list > "$RUNNER_TEMP/pg-list.txt" 2>&1
          cat "$RUNNER_TEMP/pg-list.txt" >> "$L"
          SCHEME=$(sed -n '/Schemes:/,$p' "$RUNNER_TEMP/pg-list.txt" | sed '1d' | sed -E 's/^ +//' | grep -i 'pad' | head -1)
          echo "Schema: '$SCHEME'" | tee -a "$L"
          xcodebuild -quiet -scheme "$SCHEME" -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/pg-build" CODE_SIGNING_ALLOWED=NO build >> "$L" 2>&1
          rc=$?
          set -e
          grep -E "error:" "$L" | sort -u | head -80 || true
          tail -25 "$L"
          if [ $rc -ne 0 ]; then rm -f "$GITHUB_WORKSPACE/out/PadCommander.swiftpm.zip"; exit $rc; fi
          ls -la "$GITHUB_WORKSPACE/out"

      - name: UI-Test im iPad-Simulator
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 35
        run: |
          UDID=$(python3 scripts/pick_sim.py 2> "$RUNNER_TEMP/sim.txt")
          cat "$RUNNER_TEMP/sim.txt"
          mkdir -p "$RUNNER_TEMP/shots"
          touch "$RUNNER_TEMP/test-start"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          export TEST_RUNNER_SHOTS_DIR="$RUNNER_TEMP/shots"
          set +e
          xcodebuild test -project PadCommander.xcodeproj -scheme PadCommander \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build-sim \
            -resultBundlePath "$RUNNER_TEMP/test.xcresult" > "$RUNNER_TEMP/test-full.log" 2>&1
          rc=$?
          grep -E "error:|Test Case|Test Suite|\st = |Assertion|failed|Failed|crash|Crash|Executed|ZUORDNUNG|TASTE|ESC-FELD" "$RUNNER_TEMP/test-full.log" | grep -v "warning:" > "$RUNNER_TEMP/test.log" || true
          tail -60 "$RUNNER_TEMP/test.log"
          exit $rc

      - name: Release (IPA, Playground, SideStore-Quelle)
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(cat "$RUNNER_TEMP/built_sha")
          cp PadCommander/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png out/icon.png
          sips -Z 512 out/icon.png >/dev/null 2>&1 || true
          i=1
          for s in 01-start 13-nacht 14-hochkant-nacht 15-hochkant-klassisch; do
            if [ -f "$RUNNER_TEMP/shots/$s.png" ]; then
              cp "$RUNNER_TEMP/shots/$s.png" "out/screen-$i.png"
              sips -Z 1600 "out/screen-$i.png" >/dev/null 2>&1 || true
              i=$((i + 1))
            fi
          done
          python3 scripts/make_source.py out/source.json "$VERSION" "$BUILD" out/PadCommander.ipa out
          ASSETS=(out/PadCommander.ipa out/source.json out/icon.png)
          PG="fehlt in diesem Build (siehe ci-results/playground.log)"
          if [ -f out/PadCommander.swiftpm.zip ]; then ASSETS+=(out/PadCommander.swiftpm.zip); PG="PadCommander.swiftpm.zip"; fi
          for f in out/screen-*.png; do if [ -f "$f" ]; then ASSETS+=("$f"); fi; done
          NOTES=$(cat <<EOF
          Version $VERSION (Build $BUILD), gebaut aus ${SHA:0:7} am $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M'). UI-Test im iPad-Simulator: ${{ steps.test.outcome }}.

          **Installieren** (ausführlich im README):
          1. **Direkt auf dem iPad, ohne PC:** $PG in der kostenlosen App „Swift Playground“ öffnen und ▶ antippen.
          2. **SideStore:** Quelle https://github.com/Sxbyy/pad-commander/releases/download/latest/source.json hinzufügen.
          3. **Sideloadly am PC:** PadCommander.ipa mit kostenloser Apple-ID aufspielen (alle 7 Tage erneuern).
          EOF
          )
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${ASSETS[@]}" --title "Pad Commander $VERSION (Build $BUILD)" --notes "$NOTES" --target "$SHA" --latest

      - name: Ergebnisse veröffentlichen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$RUNNER_TEMP/res"
          mkdir -p "$R/shots" "$R/crash"
          {
            echo "built=$(cat "$RUNNER_TEMP/built_sha" 2>/dev/null || echo "$GITHUB_SHA")"
            echo "run=$GITHUB_RUN_ID"
            echo "version=${VERSION:-?} (${BUILD:-?})"
            echo "edits=${{ steps.edits.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "playground=${{ steps.playground.outcome }}"
            echo "test=${{ steps.test.outcome }}"
            date -u +"time=%Y-%m-%dT%H:%M:%SZ"
          } > "$R/status.txt"
          for f in edits.log info.log build.log playground.log test.log sim.txt; do
            if [ -f "$RUNNER_TEMP/$f" ]; then cp "$RUNNER_TEMP/$f" "$R/"; fi
          done
          if [ -f "$RUNNER_TEMP/test-full.log" ]; then gzip -c "$RUNNER_TEMP/test-full.log" > "$R/test-full.log.gz"; fi
          if [ -f "$RUNNER_TEMP/build.log" ]; then grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u > "$R/errors.txt" || true; fi
          if [ -d "$RUNNER_TEMP/test.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/test.xcresult" > "$R/test-summary.json" 2>&1 || true
            xcrun xcresulttool get test-results test-details --test-id "PadCommanderUITests/testRundgang()" --path "$RUNNER_TEMP/test.xcresult" > "$R/test-details.json" 2>&1 || true
            xcrun xcresulttool get test-results test-details --test-id "PadCommanderUITests/testTastenZuordnung()" --path "$RUNNER_TEMP/test.xcresult" > "$R/test-details-keys.json" 2>&1 || true
            if ! ls "$RUNNER_TEMP/shots"/*.png >/dev/null 2>&1; then
              xcrun xcresulttool export attachments --path "$RUNNER_TEMP/test.xcresult" --output-path "$RUNNER_TEMP/shots" || true
            fi
          fi
          if [ -f "$RUNNER_TEMP/test-start" ]; then
            find "$HOME/Library/Logs/DiagnosticReports" -newer "$RUNNER_TEMP/test-start" \( -name "PadCommander*" -o -name "*.ips" \) -exec cp {} "$R/crash/" \; 2>/dev/null || true
          fi
          cp "$RUNNER_TEMP/shots"/*.png "$R/shots/" 2>/dev/null || true
          for f in "$R/shots"/*.png; do if [ -f "$f" ]; then sips -Z 1400 "$f" >/dev/null 2>&1 || true; fi; done
          cd "$R"
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Ergebnisse $GITHUB_RUN_ID"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results
